name: Trade Assistant CI

on:
  push:
    branches: [chatgpt-trade-assistant]
    paths:
      - "chatgpt-trade-assistant/**"
      - ".github/workflows/trade-assistant-ci.yml"
  pull_request:
    paths:
      - "chatgpt-trade-assistant/**"
      - ".github/workflows/trade-assistant-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt-trade-assistant
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run build
