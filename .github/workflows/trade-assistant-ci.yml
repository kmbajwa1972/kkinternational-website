name: Trade Assistant CI

on:
  push:
    branches: [chatgpt-trade-assistant]
    paths:
      - "chatgpt-trade-assistant/**"
      - ".github/workflows/trade-assistant-ci.yml"
  pull_request:
    paths:
      - "chatgpt-trade-assistant/**"
      - ".github/workflows/trade-assistant-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt-trade-assistant
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npm run build
      - name: Run tests
        run: npm test

      - name: Publish commit CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          description="CI $JOB_STATUS: build and compatibility tests"
          if [ "$JOB_STATUS" != "success" ]; then
            state=failure
            description="CI $JOB_STATUS: build or compatibility tests failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="trade-assistant-ci" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
